# $schema: https://raw.githubusercontent.com/alex-courtis/way-displays/refs/heads/master/schema/cfg-2.0.0-SNAPSHOT.yaml

## Default cfg.yaml for way-displays.
## Copy this to ~/.config/way-displays/cfg.yaml and edit it to your liking.

## See https://github.com/alex-courtis/way-displays/wiki/Configuration


## Arrange displays in a ROW (default, left to right) or a COLUMN (top to bottom)
ARRANGE: ROW

## Align ROWs at the TOP (default), MIDDLE or BOTTOM
## Align COLUMNs at the LEFT (default), MIDDLE or RIGHT
ALIGN: TOP


## Displays are matched by name or description with precedence: exact, regex, fuzzy
##
## You can identify them via logs e.g.
## DP-3 Arrived:
##     name:     'DP-3'
##     desc:     'Unknown Monitor Maker ABC123 (DP-3 via HDMI)'
##
## It is recommended to use the description rather than the nondeterministic name.
##
## Any item prefixed with a ! will be interpreted as extended POSIX regex e.g. '!^DP-1'. Regex strings must be single quoted.
## 
## Using a regex is preferred, however fuzzy case insensitive string matches of at least 4 characters may be used.
##
## 'DP-1' will match eDP-1 and DP-1. Consider using regex '!^DP-1$' to exactly match.

## The default ORDER is simply the order in which the displays are discovered. This is nondeterministic.
## You are encouraged to explicitly define your order.
ORDER:
# - '!^DP-1'
# - 'Monitor Maker ABC123'
# - 'HDMI-1'


## Enable scaling, overrides AUTO_SCALE and SCALE
SCALING: TRUE

## Round scale to 0.125 (default), 0.25, 0.5 or 1.0
SCALE_ROUND_TO: 0.125

## Round scale to NEAREST (default), UP or DOWN
SCALE_ROUND_STRATEGY: NEAREST

## The default is to scale each display by DPI.
## This may be disabled and scale 1 will be used, unless a SCALE has been specified.
AUTO_SCALE: TRUE

## DPI for auto scaling, minimum 8
AUTO_SCALE_DPI: 96

## Set an allowed range for auto scale, MAX -1 indicates unlimited
AUTO_SCALE_MIN: 1
AUTO_SCALE_MAX: -1

## Auto scale may be overridden for each display.
SCALE:
  # 'monitor description': 1.75

## Override the preferred mode.
## WARNING: this may result in an unusable display. See https://github.com/alex-courtis/way-displays#known-issues-with-workarounds
## for a possible workaround.
MODE:
  # # Resolution and refresh
  # HDMI-A-1:
  #   WIDTH: 1920
  #   HEIGHT: 1080
  #   HZ: 60

  # # Resolution with highest refresh
  # 'monitor description':
  #   WIDTH: 2560
  #   HEIGHT: 1440

  # # Highest available
  # DP-2:
  #   MAX: TRUE

## Rotate or translate the display.
## 90, 180, 270, FLIPPED, FLIPPED-90, FLIPPED-180, FLIPPED-270
TRANSFORM:
  # 'monitor description': 270

## VRR / adaptive sync is enabled by default. Disable it per display.
VRR_OFF:
# - DP-2
# - '!.*my monitor.*'

## Sets a /bin/sh command to be executed following most events.
## Obeys LOG_THRESHOLD
## ${CALLBACK_MSG} contains a human readable message 
## ${CALLBACK_LEVEL} LOG_THRESHOLD
## NOTE: Depending on your compositor this could get executed multiple times when
## a change happens. Especially likely on a (dis-)connect.
CALLBACK_CMD: notify-send "way-displays ${CALLBACK_LEVEL}" "${CALLBACK_MSG}"

## Monitor laptop lid state via libinput
LAPTOP_LID_MONITOR: TRUE


## One of: FATAL, ERROR, WARNING, INFO (default), DEBUG
## Applies to logs and callbacks
LOG_THRESHOLD: INFO


## Disable the specified displays.
## Resulting state of a display is equal to OR of all matching conditions, so
## explicit disabled without `IF` will override any conditions for the display.
DISABLED:
  # laptop display is disabled when lid is closed
  '!^eDP-[0-9]':
    IF:
    - LID: CLOSED

  # # HDMI-1 will always be disabled
  # 'HDMI-1':

  # # DP-3 will be disabled when: DP-1 AND DP-2 are plugged AND HDMI-2 is unplugged
  # 'DP-3':
  #   IF:
  #   - PLUGGED:
  #     - '!^DP-1$'
  #     - '!^DP-2$'
  #     UNPLUGGED:
  #     - 'HDMI-2'

  # # eDP-1 will be disabled when:
  # #  lid is closed  OR 
  # #  HDMI-2 is plugged AND lid is open  OR
  # #  DP-2 is plugged AND HDMI-1 is unplugged AND lid is open
  # 'eDP-1':
  #   IF:
  #   - LID: CLOSED
  #   - PLUGGED:
  #     - 'HDMI-2'
  #     LID: OPEN
  #   - PLUGGED:
  #     - 'DP-2'
  #     UNPLUGGED:
  #     - 'HDMI-1'
  #     LID: OPEN
