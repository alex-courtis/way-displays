# $schema: ../../schema/cfg-2.0.0-SNAPSHOT.yaml
# TODO v2 test empty arrays
DISABLED:
  unconditional:

  conditional:
    IF:
    - PLUGGED:
      - first
      - second
    - PLUGGED: # equal to first, erased
      - first
      - second
    - PLUGGED: # not equal to first
      - first
      - second
      LID: OPEN
    - UNPLUGGED:
      - third
      LID: CLOSED
    - PLUGGED:
      - fourth
      UNPLUGGED:
      - fifth
      - sixth
      LID: NOT_PRESENT

  '!(bad_pat_key':

  empty_if:
    IF:
    -

  unknown_if:
    IF:
    - foo:
      - bar

  bad_enum_lid:
    IF:
    - LID: foo

  bad_pat_plugged:
    IF:
    - PLUGGED:
      - '!(bad_pat_plugged'

  bad_pat_unplugged:
    IF:
    - UNPLUGGED:
      - '!(bad_pat_unplugged'

  map_lid:
    IF:
    - LID:
        foo: bar

  map_plugged:
    IF:
    - PLUGGED:
        foo: bar

  map_unplugged:
    IF:
    - UNPLUGGED:
        foo: bar

  scalar_if:
    IF: foo

  missing_if:
    FOO:

  sequ_top:
  -

