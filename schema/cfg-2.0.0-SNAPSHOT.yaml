# $schema: https://json-schema.org/draft/2020-12/schema

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/alex-courtis/way-displays/refs/heads/master/schema/cfg-2.0.0-SNAPSHOT.yaml

title: way-displays cfg
description: |-
  Schema for https://github.com/alex-courtis/way-displays cfg.yaml

type: object
properties:

  ARRANGE:
    description: |-
      Arrange displays in a ROW (default, left to right) or a COLUMN (top to bottom).
    enum:
      - ROW
      - COLUMN
    default: ROW

  ALIGN:
    description: |-
      Align ROWs at the TOP (default), MIDDLE or BOTTOM.
      Align COLUMNs at the LEFT (default), MIDDLE or RIGHT.
    enum:
      - MIDDLE
      - LEFT
      - RIGHT
      - TOP
      - BOTTOM
    default: TOP

  ORDER:
    description: |-
      ROW is arranged in order left to right.
      COLUMN is top to bottom.
      ORDER defaults to the order in which displays are discovered.
    type: array
    items:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'

  SCALING:
    description: |-
      Enable scaling, overrides AUTO_SCALE and SCALE.
    type: boolean
    default: true

  SCALE_ROUND_TO:
    description: |-
      Round scale to
    type: number
    enum:
      - 0.125
      - 0.25
      - 0.5
      - 1
    default: 0.125

  SCALE_ROUND_STRATEGY:
    description: Round scale to NEAREST (default), UP or DOWN
    enum:
      - NEAREST
      - UP
      - DOWN
    default: NEAREST

  AUTO_SCALE:
    description: |-
      The default is to scale each display by DPI.
      This may be disabled and scale 1 will be used, unless a SCALE has been specified.
    type: boolean
    default: true

  AUTO_SCALE_DPI:
    description: |-
      DPI for auto scaling, minimum 8.
    type: integer
    default: 96
    minimum: 8

  AUTO_SCALE_MIN:
    description: |-
      Set minimum value for auto scaling.
    type: number
    default: 1.0

  AUTO_SCALE_MAX:
    description: |-
      Set maximum value for auto scaling.
      Ignored if below AUTO_SCALE_MIN.
    type: number

  SCALE:
    description: |-
      Auto scale may be overridden for each display.
    type: object
    propertyNames:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'
    additionalProperties:
      type: number
      exclusiveMinimum: 0

  MODE:
    description: |-
      Override the preferred mode.
      WARNING: this may result in an unusable display. See https://github.com/alex-courtis/way-displays#known-issues-with-workarounds
    type: object
    propertyNames:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'
    additionalProperties:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/mode'

  TRANSFORM:
    description: |-
      Rotate or translate the display.
    type: object
    propertyNames:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'
    additionalProperties:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/transform'

  VRR_OFF:
    description: |-
      VRR / adaptive sync is enabled by default. Disable it per display.
    type: array
    items:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'

  CALLBACK_CMD:
    description: |-
      Sets a /bin/sh command to be executed following most events.
      Obeys LOG_THRESHOLD
      ${CALLBACK_MSG} contains a human readable message 
      ${CALLBACK_LEVEL} LOG_THRESHOLD
      NOTE: Depending on your compositor this could get executed multiple times when a change happens. Especially likely on a (dis-)connect.
    type: string

  LAPTOP_DISPLAY_PREFIX:
    description: |-
      Laptop displays usually start with eDP e.g. eDP-1.
      This may be overridden if your laptop is different.
    type: string

  LAPTOP_LID_MONITOR:
    description: |-
      Enable laptop lid detection.
    type: boolean
    default: true

  LOG_THRESHOLD:
    description: |-
      Applies to logs and callbacks.
    $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/log_threshold'
    default: INFO

  DISABLED:
    description: |-
      Disable the specified displays with optional conditions.
    type: object
    propertyNames:
      $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/fuzzy_display_match'
    additionalProperties:
      anyOf:
        - type: "null"
        - type: object
          properties:
            IF:
              description: |-
                A list of conditions. Evaluates to true if at least one of the conditions is true.
              type: array
              items:
                $ref: 'types-2.0.0-SNAPSHOT.yaml#/$defs/condition'
              minItems: 1
          additionalProperties: false

additionalProperties: false
